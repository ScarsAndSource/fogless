<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="Fogless — sign in to your calm JRPG budget companion."/>
<title>Fogless — Sign in</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --linen: #FBF8F1; --linen-2: #F3ECE0; --sage: #5B8B67; --sage-light: #E5F2E7;
    --sage-dark: #2A4533; --sage-border: #6E9B79; --rose-dark: #6C352D;
    --ink: #243528; --ink-muted: #716450; --border: #D7CDBB; --border-light: #E8E0D0;
    --shadow-card: 0 1px 4px rgba(0,0,0,0.08), 0 4px 16px rgba(0,0,0,0.06);
  }
  html, body { min-height: 100%; }
  body, input, button { font-family: 'Space Mono', monospace; }
  body {
    font-size: 14px; color: var(--ink); background: var(--linen);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .login-card {
    width: min(380px, 100%); background: white; border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow-card); padding: 28px 24px 22px;
  }
  .brand {
    font-family: 'Press Start 2P', monospace; font-size: 8px; color: var(--sage);
    letter-spacing: 0.1em; text-transform: uppercase;
    display: flex; align-items: center; gap: 6px; margin-bottom: 20px;
  }
  .brand-dot { width: 6px; height: 6px; background: #4ADE80; border-radius: 50%; box-shadow: 0 0 8px #4ADE80; }
  .hero { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .hero-avatar {
    width: 52px; height: 52px; background: #F0FAF3; border: 1.5px solid var(--sage-border);
    border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .hero-title { font-size: 15px; font-weight: 700; }
  .hero-sub { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }
  label {
    display: block; font-family: 'Press Start 2P', monospace; font-size: 7px;
    color: var(--sage); letter-spacing: 0.08em; margin: 14px 0 6px;
  }
  .field { position: relative; }
  input {
    width: 100%; padding: 11px 12px; font-size: 14px; color: var(--ink);
    background: var(--linen); border: 1px solid var(--border); border-radius: 8px; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus { border-color: var(--sage); box-shadow: 0 0 0 3px var(--sage-light); }
  #password { padding-right: 64px; }
  .toggle-pw {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    font-family: 'Press Start 2P', monospace; font-size: 6.5px; color: var(--sage);
    background: none; border: none; cursor: pointer; padding: 8px 6px; border-radius: 4px;
  }
  .toggle-pw:hover { background: var(--sage-light); }
  .error {
    min-height: 18px; margin-top: 12px; font-size: 12px; color: #B91C1C;
  }
  .submit {
    width: 100%; margin-top: 6px; padding: 12px; cursor: pointer;
    font-family: 'Press Start 2P', monospace; font-size: 9px; letter-spacing: 0.08em;
    color: white; background: var(--sage); border: 1px solid var(--sage-dark); border-radius: 8px;
    transition: background 0.15s, transform 0.05s;
  }
  .submit:hover:not(:disabled) { background: #4C7857; }
  .submit:active:not(:disabled) { transform: translateY(1px); }
  .submit:disabled { opacity: 0.65; cursor: default; }
  .foot { margin-top: 16px; text-align: center; font-size: 10px; color: var(--ink-muted); }
  .shake { animation: shake 0.35s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); }
  }
  @media (prefers-reduced-motion: reduce) { .shake { animation: none; } }

  [hidden] { display: none !important; }
  .tabs { display: flex; gap: 6px; margin: 0 0 4px; }
  .tab {
    flex: 1; padding: 9px 6px; cursor: pointer; background: var(--linen); color: var(--ink-muted);
    font-family: 'Press Start 2P', monospace; font-size: 7px; letter-spacing: 0.06em;
    border: 1px solid var(--border); border-radius: 8px;
  }
  .tab[aria-selected="true"] { background: var(--sage-light); color: var(--sage-dark); border-color: var(--sage-border); }
  .info { min-height: 0; margin-top: 12px; font-size: 12px; color: var(--sage-dark); }
  .info:empty { display: none; }
  .linkbtn {
    display: block; margin: 12px auto 0; background: none; border: none; cursor: pointer;
    font-size: 11px; color: var(--sage); text-decoration: underline; padding: 4px;
  }
  .hint { font-size: 10px; color: var(--ink-muted); margin-top: 5px; }

</style>
<link rel="stylesheet" href="/mobile.css?v=2"/>
</head>
<body>

<main class="login-card" id="card">
  <div class="brand"><div class="brand-dot"></div>FOGLESS</div>

  <div class="hero">
    <div class="hero-avatar">
      <svg width="38" height="38" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="9" y="0" width="2" height="3" fill="#204E2D"/>
        <rect x="11" y="1" width="3" height="1" fill="#4ADE80"/>
        <rect x="10" y="2" width="4" height="2" fill="#22C55E"/>
        <rect x="8" y="1" width="2" height="1" fill="#86EFAC"/>
        <rect x="9" y="3" width="2" height="1" fill="#FBBF24"/>
        <rect x="6" y="4" width="8" height="1" fill="#22482E"/>
        <rect x="4" y="5" width="12" height="9" fill="#9AE3AD"/>
        <rect x="3" y="6" width="1" height="7" fill="#22482E"/>
        <rect x="16" y="6" width="1" height="7" fill="#22482E"/>
        <rect x="4" y="14" width="12" height="1" fill="#22482E"/>
        <rect x="5" y="5" width="2" height="2" fill="#E8FDF0"/>
        <rect x="7" y="5" width="4" height="1" fill="#C1F5D0"/>
        <rect x="4" y="9" width="2" height="2" fill="#FCA5A5"/>
        <rect x="14" y="9" width="2" height="2" fill="#FCA5A5"/>
        <rect x="7" y="7" width="2" height="3" fill="#142B1A"/>
        <rect x="11" y="7" width="2" height="3" fill="#142B1A"/>
        <rect x="7" y="7" width="1" height="1" fill="#FFFFFF"/>
        <rect x="11" y="7" width="1" height="1" fill="#FFFFFF"/>
        <rect x="9" y="11" width="2" height="1" fill="#142B1A"/>
        <rect x="6" y="15" width="2" height="1" fill="#1A3820"/>
        <rect x="12" y="15" width="2" height="1" fill="#1A3820"/>
      </svg>
    </div>
    <div>
      <div class="hero-title" id="hero-title">Welcome back</div>
      <div class="hero-sub" id="hero-sub">Extreme is waiting in the sanctuary.</div>
    </div>
  </div>

  <div class="tabs" role="tablist" id="tabs">
    <button type="button" class="tab" role="tab" id="tab-signin" aria-selected="true">SIGN IN</button>
    <button type="button" class="tab" role="tab" id="tab-signup" aria-selected="false">CREATE ACCOUNT</button>
  </div>

  <form id="auth-form" autocomplete="on" novalidate>
    <label for="email">EMAIL</label>
    <input id="email" name="email" type="email" autocomplete="username" inputmode="email"
           autocapitalize="none" autocorrect="off" spellcheck="false" autofocus required/>

    <div id="pw-wrap">
      <label for="password">PASSWORD</label>
      <div class="field">
        <input id="password" name="password" type="password" autocomplete="current-password" required/>
        <button class="toggle-pw" id="toggle-pw" type="button" aria-label="Show password">SHOW</button>
      </div>
      <div class="hint" id="pw-hint" hidden>At least 8 characters.</div>
    </div>

    <div id="confirm-wrap" hidden>
      <label for="confirm">CONFIRM PASSWORD</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password"/>
    </div>

    <div id="code-wrap" hidden>
      <label for="code">INVITE CODE</label>
      <input id="code" name="code" type="text" autocomplete="off" autocapitalize="none" spellcheck="false"/>
    </div>

    <div class="error" id="error" role="alert" aria-live="polite"></div>
    <div class="info" id="info" role="status" aria-live="polite"></div>

    <button class="submit" id="submit" type="submit">ENTER SANCTUARY</button>
  </form>

  <button class="linkbtn" id="link-forgot" type="button">Forgot your password?</button>
  <button class="linkbtn" id="link-back" type="button" hidden>Back to sign in</button>

  <div class="foot">Your ledger is private to your account. &middot; <a href="/privacy.html" style="color:inherit">Privacy</a></div>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var form = $('auth-form'), emailEl = $('email'), passEl = $('password'), confirmEl = $('confirm'), codeEl = $('code');
  var errEl = $('error'), infoEl = $('info'), btn = $('submit'), card = $('card');
  var tabs = $('tabs'), tabIn = $('tab-signin'), tabUp = $('tab-signup');
  var linkForgot = $('link-forgot'), linkBack = $('link-back');
  var mode = 'signin';
  var config = { signups_open: true, needs_code: false };
  var tz = '';
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { /* optional */ }

  var LABEL = { signin: 'ENTER SANCTUARY', signup: 'CREATE ACCOUNT', forgot: 'SEND RESET LINK' };

  // Already signed in? Skip straight to the app.
  fetch('/api/session', { credentials: 'same-origin', cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d && d.authenticated) location.replace('/'); })
    .catch(function () { /* stay on the page */ });

  // Is registration open? Is an invite code needed?
  fetch('/api/config', { credentials: 'same-origin', cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.ok) return;
      config = d;
      if (!d.signups_open) { tabUp.hidden = true; if (mode === 'signup') setMode('signin'); }
      if (location.hash === '#signup' && d.signups_open) setMode('signup');
      applyMode();
    })
    .catch(function () { /* defaults are fine */ });

  function fail(msg) {
    infoEl.textContent = '';
    errEl.textContent = msg;
    card.classList.remove('shake');
    void card.offsetWidth; // restart the animation
    card.classList.add('shake');
  }
  function ok(msg) { errEl.textContent = ''; infoEl.textContent = msg; }
  function busy(on) { btn.disabled = on; btn.textContent = on ? 'WORKING\u2026' : LABEL[mode]; }

  function setMode(m) { mode = m; applyMode(); errEl.textContent = ''; infoEl.textContent = ''; }
  function applyMode() {
    var up = mode === 'signup', forgot = mode === 'forgot';
    tabs.hidden = forgot || !config.signups_open;
    tabIn.setAttribute('aria-selected', String(mode === 'signin'));
    tabUp.setAttribute('aria-selected', String(up));
    $('pw-wrap').hidden = forgot;
    $('pw-hint').hidden = !up;
    $('confirm-wrap').hidden = !up;
    $('code-wrap').hidden = !(up && config.needs_code);
    passEl.autocomplete = up ? 'new-password' : 'current-password';
    passEl.required = !forgot;
    linkForgot.hidden = mode !== 'signin';
    linkBack.hidden = !forgot;
    $('hero-title').textContent = forgot ? 'Reset password' : up ? 'Join the sanctuary' : 'Welcome back';
    $('hero-sub').textContent = forgot ? 'We will email you a link.' :
      up ? 'Create your own private ledger.' : 'Extreme is waiting in the sanctuary.';
    btn.textContent = LABEL[mode];
  }
  tabIn.addEventListener('click', function () { setMode('signin'); });
  tabUp.addEventListener('click', function () { setMode('signup'); });
  linkForgot.addEventListener('click', function () { setMode('forgot'); });
  linkBack.addEventListener('click', function () { setMode('signin'); });

  $('toggle-pw').addEventListener('click', function () {
    var show = passEl.type === 'password';
    passEl.type = show ? 'text' : 'password';
    this.textContent = show ? 'HIDE' : 'SHOW';
    this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  function post(path, payload) {
    return fetch(path, {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (data) { return { res: res, data: data }; });
    });
  }
  function msgOf(r, fallback) {
    return (r.data && r.data.text) || (fallback + ' (HTTP ' + r.res.status + ').');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errEl.textContent = ''; infoEl.textContent = '';
    var email = emailEl.value.trim(), password = passEl.value;
    if (!email) { fail('Enter your email address.'); return; }

    if (mode === 'forgot') {
      busy(true);
      post('/api/forgot', { email: email }).then(function (r) {
        busy(false);
        if (r.res.ok && r.data && r.data.ok) ok(r.data.text);
        else fail(msgOf(r, 'Could not send the reset link'));
      }).catch(function () { busy(false); fail('Could not reach the server. Try again.'); });
      return;
    }

    if (!password) { fail('Enter your password.'); return; }
    if (mode === 'signup') {
      if (password.length < 8) { fail('Password must be at least 8 characters.'); return; }
      if (password !== confirmEl.value) { fail('The two passwords do not match.'); return; }
    }

    busy(true);
    var payload = { email: email, password: password, tz: tz };
    if (mode === 'signup' && config.needs_code) payload.code = codeEl.value.trim();
    post(mode === 'signup' ? '/api/signup' : '/api/login', payload)
      .then(function (r) {
        if (r.res.ok && r.data && r.data.ok) {
          if (mode === 'signup' && r.data.signed_in === false) {   // email confirmation is switched on
            busy(false);
            ok(r.data.text || 'Check your inbox to confirm your email, then sign in.');
            setMode('signin');
            infoEl.textContent = r.data.text || 'Check your inbox to confirm your email, then sign in.';
            return;
          }
          btn.textContent = 'WELCOME!';
          location.replace('/');
          return;
        }
        busy(false);
        fail(msgOf(r, mode === 'signup' ? 'Could not create the account' : 'Sign-in failed'));
        if (mode === 'signin') passEl.select();
      })
      .catch(function () { busy(false); fail('Could not reach the server. Try again.'); });
  });

  applyMode();
})();
</script>
</body>
</html>
